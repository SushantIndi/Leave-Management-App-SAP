_schema-version: "3.1"
ID: leave-app-cap
version: 1.0.0

modules:

  - name: leave-approuter
    type: approuter.nodejs
    path: app/router

    requires:
      - name: leave-xsuaa

      - name: leave-app-api
        group: destinations
        properties:
          name: leave-app-api
          url: ~{url}
          forwardAuthToken: true

    parameters:
      memory: 256M
  
  - name: leave-app-cap
    type: nodejs
    path: .
    
    parameters:
      memory: 256M
      disk-quota: 512M

    build-parameters:
      builder: npm

    provides:
      - name: leave-app-api
        properties:
          url: ${default-url}

    requires:
      - name: leave-destination
      - name: leave-xsuaa
      - name: leave-hdi

  - name: leave-db-deployer
    type: hdb
    path: gen/db

    requires:
      - name: leave-hdi

resources:
  - name: leave-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: leave-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  
  - name: leave-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared